# AI 基本面研究员 — Docker Compose
version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8800:8800"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8800
      - AFR_API_KEY=${AFR_API_KEY:-changeme-set-in-production}
      - AFR_API_KEY_REQUIRED=${AFR_API_KEY_REQUIRED:-true}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - AFR_ENABLE_RAG=true
      - AFR_ENABLE_BACKTEST=true
      - AFR_ENABLE_PORTFOLIO=true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8800
      - NEXT_PUBLIC_AFR_API_KEY=${AFR_API_KEY:-changeme-set-in-production}
    depends_on:
      - backend
    restart: unless-stopped
