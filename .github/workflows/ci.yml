name: CI

# 说明:本项目大量测试依赖真实数据库(stocks/财务表等),CI 干净环境没有 data/(已 gitignore),
# 故只跑「不依赖真实库、不联网」的纯逻辑测试子集;前端用 build(能编译打包)替代 lint(风格噪音多)。
# 绿灯 = 核心逻辑没跑挂 + 前端能构建。需要库的测试在本地跑。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run DB-independent tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_backtest_execution.py \
            tests/test_market_data_cache.py \
            tests/test_market_index.py \
            tests/test_ml_cv.py \
            tests/test_ml_impute.py \
            tests/test_onboard.py \
            tests/test_pnl_metrics.py \
            tests/test_profile_isolation.py \
            tests/test_regime_cluster.py \
            tests/test_regime_jump.py \
            tests/test_regime_validation.py \
            tests/test_technical_rule_engine.py \
            tests/test_yoy.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
