<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Dev Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    .card {
      text-align: center;
      padding: 48px 64px;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 32px;
    }
    .spinner-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #2a2a3a;
      border-top-color: #7c6af7;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      font-size: 13px;
      color: #888;
    }
    .dots span {
      animation: blink 1.2s infinite;
      opacity: 0;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔬</div>
    <h1>AI Fundamental Researcher</h1>
    <p class="subtitle">Research assistant powered by DeepSeek</p>
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <span id="status">Launching AI backend</span>
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  </div>
</body>
</html>
