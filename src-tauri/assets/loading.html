<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Dev Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    .card {
      text-align: center;
      padding: 48px 64px;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 32px;
    }
    .spinner-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #2a2a3a;
      border-top-color: #7c6af7;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      font-size: 13px;
      color: #888;
    }
    .dots span {
      animation: blink 1.2s infinite;
      opacity: 0;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔬</div>
    <h1>AI Fundamental Researcher</h1>
    <p class="subtitle">Research assistant powered by DeepSeek</p>
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <span id="status">Launching AI backend</span>
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  </div>
  <script>
    // 自导航:不依赖 Rust 端 eval(其在 webview 未就绪时会静默失败,导致永远卡在本页)。
    // 页面自身轮询前端就绪后跳转,消除导航时序竞态。
    (function () {
      var FRONTEND = "http://127.0.0.1:3002";
      var statusEl = document.getElementById("status");
      var tries = 0;
      function attempt() {
        tries++;
        // no-cors:只探测可达性(拿到不透明响应即视为就绪),避免跨源CORS导致误判
        fetch(FRONTEND + "/", { mode: "no-cors", cache: "no-store" })
          .then(function () {
            statusEl.textContent = "Loading interface";
            window.location.replace(FRONTEND);
          })
          .catch(function () {
            if (tries < 150) {
              statusEl.textContent = "Launching AI backend (" + tries + ")";
              setTimeout(attempt, 800);
            } else {
              statusEl.textContent = "启动超时,请重开 app 或运行 ./launch.sh daemon";
            }
          });
      }
      attempt();
    })();
  </script>
</body>
</html>
