<title>Stock Pilot 界面 Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 一扇悬浮在流动壁纸上的玻璃窗;侧边栏与内容同在一层玻璃,检查器和工具栏是更轻的浮动玻璃;窄屏变单栏 + 浮动玻璃标签栏 */
:root{
  --wall-1:#c9dcff; --wall-2:#f6d7ef; --wall-3:#d6f2ea; --wall-4:#fde7cf; --wall-base:#eef1f8;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-thin:rgba(255,255,255,.32);
  --edge:rgba(255,255,255,.75); --edge-dim:rgba(255,255,255,.35); --hair:rgba(20,30,60,.08);
  --fg:#111318; --fg-2:rgba(17,19,24,.58); --fg-3:rgba(17,19,24,.36);
  --accent:#0a6cff; --accent-ink:#ffffff; --sel:rgba(255,255,255,.78);
  --up:#e5322d; --down:#109a4b; --warn:#c77700;
  --shadow:0 30px 80px rgba(40,50,90,.22),0 8px 24px rgba(40,50,90,.10);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei",sans-serif;
  --f-num:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --wglass:rgba(255,255,255,.20); --sheen:rgba(255,255,255,.55); --sheen-2:rgba(255,255,255,.18); --glow:rgba(255,255,255,.55); --shell:rgba(255,255,255,.30); --shell-side:rgba(255,255,255,.22);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.22,1,.36,1);
}
@supports (transition-timing-function: linear(0, 1)){
  :root{--spring:linear(0, 0.006, 0.025 2.8%, 0.101 6.1%, 0.539 18.9%, 0.721 25.3%, 0.849 31.5%, 0.937 38.1%, 0.968 41.8%, 0.991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1)}
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall-1:#1d2b6b; --wall-2:#4a1f5c; --wall-3:#0f4a4a; --wall-4:#5a3418; --wall-base:#0b0d14;
  --glass:rgba(28,30,38,.50); --glass-strong:rgba(34,36,46,.72); --glass-thin:rgba(40,42,54,.30);
  --edge:rgba(255,255,255,.16); --edge-dim:rgba(255,255,255,.07); --hair:rgba(255,255,255,.08);
  --fg:#f4f5f8; --fg-2:rgba(244,245,248,.60); --fg-3:rgba(244,245,248,.34);
  --accent:#4c93ff; --sel:rgba(255,255,255,.12);
  --up:#ff5a52; --down:#34d36b; --warn:#ffb340;
  --wglass:rgba(40,44,60,.22); --sheen:rgba(255,255,255,.14); --sheen-2:rgba(255,255,255,.05); --glow:rgba(255,255,255,.12); --shell:rgba(18,20,28,.42); --shell-side:rgba(18,20,28,.30);
  --shadow:0 30px 80px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall-1:#1d2b6b; --wall-2:#4a1f5c; --wall-3:#0f4a4a; --wall-4:#5a3418; --wall-base:#0b0d14;
  --glass:rgba(28,30,38,.50); --glass-strong:rgba(34,36,46,.72); --glass-thin:rgba(40,42,54,.30);
  --edge:rgba(255,255,255,.16); --edge-dim:rgba(255,255,255,.07); --hair:rgba(255,255,255,.08);
  --fg:#f4f5f8; --fg-2:rgba(244,245,248,.60); --fg-3:rgba(244,245,248,.34);
  --accent:#4c93ff; --sel:rgba(255,255,255,.12);
  --up:#ff5a52; --down:#34d36b; --warn:#ffb340;
  --wglass:rgba(40,44,60,.22); --sheen:rgba(255,255,255,.14); --sheen-2:rgba(255,255,255,.05); --glow:rgba(255,255,255,.12); --shell:rgba(18,20,28,.42); --shell-side:rgba(18,20,28,.30);
  --shadow:0 30px 80px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall-base);color:var(--fg);font-family:var(--f-ui);font-size:13px;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 84px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:0}
.up{color:var(--up)} .down{color:var(--down)}

/* 流动壁纸 */
.wall{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--wall-base)}
.wall i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.9;animation:drift 26s var(--ease) infinite alternate}
.wall i:nth-child(1){background:var(--wall-1);left:-14vmax;top:-18vmax}
.wall i:nth-child(2){background:var(--wall-2);right:-18vmax;top:-10vmax;animation-duration:31s;animation-delay:-8s}
.wall i:nth-child(3){background:var(--wall-3);left:6vmax;bottom:-26vmax;animation-duration:34s;animation-delay:-14s}
.wall i:nth-child(4){background:var(--wall-4);right:-6vmax;bottom:-30vmax;animation-duration:29s;animation-delay:-4s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.08)}100%{transform:translate(-4vmax,7vmax) scale(.96)}}

/* 玻璃材质 */
.glass{background:var(--glass);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--edge-dim),var(--shadow)}
.glass-thin{background:var(--glass-thin);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--edge-dim)}

/* 窗口 */
/* 窗口本身不做 backdrop-filter(否则里面的小组件只能"看到"窗口底色,透不出壁纸);壁纸本来就是柔焦的,半透明即可 */
.win{position:relative;max-width:1240px;height:100%;margin:0 auto;border-radius:24px;display:grid;grid-template-columns:228px minmax(0,1fr);overflow:hidden;
  animation:winIn .9s var(--spring) both}
.win.glass{background:var(--shell);backdrop-filter:none;-webkit-backdrop-filter:none}
.win .side{background:var(--shell-side)}
@keyframes winIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

.side{display:flex;flex-direction:column;min-width:0;padding:14px 10px 12px;position:relative}
.lights{display:flex;gap:8px;padding:4px 8px 14px}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.search{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;border-radius:10px;color:var(--fg-3);font-size:12.5px;margin-bottom:8px;transition:background .3s var(--ease)}
.search:hover{background:var(--sel)}
.search kbd{margin-left:auto;font-family:var(--f-ui);font-size:11px;opacity:.8}
.nav{position:relative;overflow:auto;flex:1;scrollbar-width:none}
.nav h6{margin:14px 10px 4px;font-size:11px;font-weight:600;color:var(--fg-3)}
/* 折叠式导航:只有 5 个分区常驻,当前分区展开子页面 */
.sec{display:flex;flex-direction:column}
.nav .sh{font-weight:500;color:var(--fg-2);margin-top:2px}
.nav .sh .chev{margin-left:auto;color:var(--fg-3);transition:transform .5s var(--spring)}
.sec.open .sh{color:var(--fg)}
.sec.open .sh .chev{transform:rotate(90deg)}
.subwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--spring)}
.sec.open .subwrap{grid-template-rows:1fr}
.subwrap>div{overflow:hidden;min-height:0}
.nav .sub{padding-left:32px;font-size:12.5px;opacity:0;transform:translateY(-4px);transition:opacity .3s var(--ease),transform .45s var(--spring),color .25s var(--ease)}
.sec.open .sub{opacity:1;transform:none}
.sec.open .sub:nth-child(2){transition-delay:.03s}.sec.open .sub:nth-child(3){transition-delay:.06s}.sec.open .sub:nth-child(4){transition-delay:.09s}.sec.open .sub:nth-child(5){transition-delay:.12s}.sec.open .sub:nth-child(6){transition-delay:.15s}
.nav .sub svg{display:none}
.navsep{height:1px;background:var(--hair);margin:10px 10px}
.pin-h{margin:4px 10px 4px;font-size:11px;font-weight:600;color:var(--fg-3)}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:9px;text-align:left;font-size:13px;color:var(--fg-2);transition:color .25s var(--ease),transform .2s var(--ease)}
.nav button:active{transform:scale(.98)}
.nav button[aria-current="true"]{color:var(--fg)}
.nav button svg{flex:none;color:var(--accent);opacity:.9}
.nav button .soon{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--fg-3)}
.pill{position:absolute;left:0;right:0;z-index:0;border-radius:9px;background:var(--sel);box-shadow:0 1px 2px rgba(0,0,0,.06),inset 0 0 0 .5px var(--edge-dim);
  transition:transform .55s var(--spring),height .55s var(--spring);pointer-events:none}
.foot{display:flex;align-items:center;gap:8px;padding:10px 10px 2px;color:var(--fg-3);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px color-mix(in srgb,var(--down) 22%,transparent)}

.main{position:relative;min-width:0;display:flex;flex-direction:column;background:transparent;border-left:1px solid var(--hair)}
.toolbar{position:absolute;top:14px;right:14px;z-index:5;display:flex;gap:2px;padding:4px;border-radius:999px}
.tb{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--fg-2);transition:background .3s var(--ease),color .3s var(--ease),transform .2s var(--ease)}
.tb:hover{background:var(--sel);color:var(--fg)}
.tb:active{transform:scale(.92)}
.tb[aria-pressed="true"]{color:var(--accent)}
.stage{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;padding:26px 34px 40px;scrollbar-width:thin}
.view.with-insp{padding-right:330px}
.eyebrow{font-size:12px;color:var(--fg-3);margin:2px 0 4px;height:16px}
.title{font-size:30px;font-weight:700;letter-spacing:-.022em;margin:0 0 22px;text-wrap:balance}

/* 交错入场 */
.st{animation:rise .7s var(--spring) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* 小组件:真正透出壁纸的薄玻璃 + 随鼠标移动的高光 + 轻微 3D 倾斜;不等大的拼贴布局 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:150px;grid-auto-flow:dense;gap:14px}
.w{--tint:transparent;position:relative;border-radius:26px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%;height:100%;overflow:hidden;isolation:isolate;
  background:linear-gradient(155deg,color-mix(in srgb,var(--tint) 22%,transparent) 0%,transparent 62%),var(--wglass);
  backdrop-filter:blur(28px) saturate(1.9);-webkit-backdrop-filter:blur(28px) saturate(1.9);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--edge-dim),0 10px 30px rgba(40,50,90,.07);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)) scale(var(--sc,1));
  transition:transform .7s var(--spring),box-shadow .5s var(--ease)}
.w::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,var(--sheen) 0%,transparent 38%,transparent 70%,var(--sheen-2) 100%)}
.w::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s var(--ease);
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 65%)}
.w.hot{transition:transform .18s ease-out,box-shadow .5s var(--ease);--ty:-3px;box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--edge-dim),0 22px 48px rgba(40,50,90,.16)}
.w.hot::after{opacity:1}
.w:active{--sc:.98}
.w.span2{grid-column:span 2}
.w.tall{grid-row:span 2}
.w[data-tint="up"]{--tint:var(--up)} .w[data-tint="down"]{--tint:var(--down)} .w[data-tint="blue"]{--tint:var(--accent)} .w[data-tint="violet"]{--tint:#8b5cf6} .w[data-tint="amber"]{--tint:#f59e0b} .w[data-tint="teal"]{--tint:#14b8a6}
@media (max-width:760px){.w.span2{grid-column:auto}.w.tall{grid-row:auto}.grid{grid-auto-rows:auto}.w{min-height:150px}}
svg.spark.lg{height:auto;flex:1;min-height:80px}
.wt{font-size:12px;font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.wn{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.ws{font-size:12px;color:var(--fg-2)}
.meter{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--hair);margin-top:auto}
.meter span{display:block;height:100%;transform-origin:left;animation:grow 1.1s var(--spring) both .25s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 16px;font-size:12px;margin-top:auto}
.mini div{display:flex;justify-content:space-between;gap:8px}
svg.spark{width:100%;height:58px;display:block;margin-top:auto;overflow:visible}
svg.spark .ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.4s var(--ease) forwards .2s}
@keyframes draw{to{stroke-dashoffset:0}}
svg.spark .ar{opacity:0;animation:fade .8s var(--ease) forwards .9s}
@keyframes fade{to{opacity:.12}}
.soon-tag{font-size:10.5px;color:var(--fg-3);margin-left:auto;font-weight:500}

/* 列表 + 详情 */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
.list{display:flex;flex-direction:column;gap:2px;position:relative}
.row{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:9px 12px;border-radius:12px;width:100%;text-align:left;transition:transform .2s var(--ease)}
.row:active{transform:scale(.985)}
.row .r1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r2{font-size:11.5px;color:var(--fg-3)}
.row .rv{text-align:right;grid-row:span 2;align-self:center}
.lpill{position:absolute;left:0;right:0;border-radius:12px;background:var(--glass-strong);box-shadow:0 4px 14px rgba(40,50,90,.10),inset 0 0 0 .5px var(--edge);z-index:0;transition:transform .55s var(--spring),height .55s var(--spring);pointer-events:none}
.detail{min-width:0}
.big{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1}
.chg{font-size:17px;font-weight:500;margin-left:8px}
.facts{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0 22px}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts span{font-size:11.5px;color:var(--fg-3)}
.facts b{font-size:17px;font-weight:600}
.card{border-radius:18px;padding:16px 18px;margin-bottom:14px}
.card h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--fg-2)}
.bar3{display:grid;grid-template-columns:56px 1fr 32px;align-items:center;gap:10px;font-size:12px;margin:7px 0}
.bar3 i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#a7c8ff));transform-origin:left;animation:grow 1s var(--spring) both .3s}
.bar3 em{font-style:normal;text-align:right;color:var(--fg-2)}
.soonline{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;color:var(--fg-2);font-size:12.5px}
.soonline b{font-weight:600;color:var(--fg)}
.soonline .code{margin-left:auto;font-size:11px;color:var(--fg-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;font-size:12px}

/* 热力 */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.heat div{border-radius:14px;padding:12px;transition:transform .45s var(--spring)}
.heat div:hover{transform:scale(1.04)}
.heat small{display:block;font-size:12px;opacity:.85}
.heat b{font-size:16px;font-weight:600}

/* 学习 */
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.area{border-radius:20px;padding:18px}
.area h4{margin:0 0 12px;font-size:15px;font-weight:600}
.area li{list-style:none;display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--hair);color:var(--fg-2)}
.area ul{margin:0;padding:0}
.lvl{color:var(--warn);font-size:10px;letter-spacing:1px}

/* 数据 */
.tbl{border-radius:18px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:11px 16px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--hair)}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;color:var(--fg-3);font-weight:500}
.r{text-align:right}
.st-dot{display:inline-flex;align-items:center;gap:6px}
.st-dot i{width:7px;height:7px;border-radius:50%}

/* 检查器:浮动玻璃,从右侧滑入 */
.insp{position:absolute;top:62px;right:14px;bottom:14px;width:300px;border-radius:20px;padding:18px;overflow:auto;z-index:4;
  transform:translateX(calc(100% + 24px));opacity:0;transition:transform .6s var(--spring),opacity .35s var(--ease)}
.insp.open{transform:none;opacity:1}
.insp h3{margin:0 0 4px;font-size:15px;font-weight:600}
.insp .sub{color:var(--fg-3);font-size:12px;margin-bottom:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--fg-2)} .kv dd{margin:0;text-align:right}
.hr{height:1px;background:var(--hair);margin:16px 0}

/* 底部浮动胶囊:方案切换 */
.dock{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;max-width:calc(100% - 32px)}
.seg{position:relative;display:flex;gap:0}
.seg button{position:relative;z-index:1;padding:8px 14px;border-radius:999px;font-size:12.5px;color:var(--fg-2);white-space:nowrap;transition:color .3s var(--ease)}
.seg button[aria-pressed="true"]{color:var(--fg)}
.thumb{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--glass-strong);box-shadow:0 2px 10px rgba(40,50,90,.14),inset 0 0 0 .5px var(--edge);transition:transform .55s var(--spring),width .55s var(--spring)}
.sep{width:1px;height:20px;background:var(--hair);margin:0 2px}
.info{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px) scale(.97);width:min(420px,calc(100% - 32px));border-radius:18px;padding:14px 16px;font-size:12.5px;line-height:1.6;color:var(--fg-2);z-index:21;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .5s var(--spring)}
.info.open{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.info b{color:var(--fg)}

/* ⌘K */
.scrim{position:fixed;inset:0;z-index:40;display:grid;place-items:start center;padding:max(90px,env(safe-area-inset-top,0px)) 16px 16px;background:rgba(10,14,30,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.pal{width:min(580px,100%);border-radius:22px;overflow:hidden;transform:scale(.95) translateY(-8px);transition:transform .55s var(--spring)}
.scrim.open .pal{transform:none}
.pal .q{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--hair);color:var(--fg-3)}
.pal input{flex:1;border:0;background:transparent;color:var(--fg);font:inherit;font-size:18px;outline:none;min-width:0}

.res{max-height:360px;overflow:auto;padding:8px;position:relative}
.res button{position:relative;z-index:1;display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:12px;text-align:left}
.res .t{margin-left:auto;font-size:11px;color:var(--fg-3)}

.tabs button[aria-current="true"]{background:var(--glass-strong);color:var(--fg)}
.win.mA{grid-template-columns:0 minmax(0,1fr)}
.win.mA .side{visibility:hidden}
.win.mA .tabs{display:flex}
.win.mA .view{padding-top:74px}
.win.mC{grid-template-columns:0 minmax(0,1fr)}
.win.mC .side{visibility:hidden}
.win{transition:grid-template-columns .6s var(--spring)}

/* 窄屏 */
.mtab{display:none}
@media (max-width:860px){
  body{padding-block:12px 96px}
  .win,.win.mA,.win.mC{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{border-left:0}
  .view,.view.with-insp{padding:62px 18px 32px}
  .split{grid-template-columns:minmax(0,1fr)}
  .insp{left:14px;width:auto;top:auto;max-height:60%}

  .mtab{display:flex;position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:19;padding:5px;border-radius:999px;gap:2px}

  .seg button{padding:8px 10px;font-size:11.5px}
}

function spark(arr,h=58,cls=''){
  const w=300,mn=Math.min(...arr),mx=Math.max(...arr),p=3;
  const pts=arr.map((v,i)=>[p+i*(w-2*p)/(arr.length-1),p+(h-2*p)*(1-(v-mn)/(mx-mn||1))]);
  // 平滑曲线
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`}
  const col=arr[arr.length-1]>=arr[0]?'var(--up)':'var(--down)',L=pts[pts.length-1];
  return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true" style="--len:${w*2.2}"><path class="ar" d="${d} L${L[0]} ${h} L${p} ${h}Z" fill="${col}"/><path class="ln" d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function navTarget(){

function movePill(instant){
  const pill=$("navpill"),b=navTarget();if(!pill||!b)return;
  const nr=$("nav").getBoundingClientRect(),br=b.getBoundingClientRect(),top=br.top-nr.top+$("nav").scrollTop;
  if(instant)pill.style.transition='none';
  pill.style.height=br.height+'px';pill.style.transform=`translateY(${top}px)`;
  if(instant){pill.offsetHeight;pill.style.transition=''}
}
function followPill(ms){ // 分区展开/收起动画期间,选中块跟着走
  const t0=performance.now();const f=t=>{movePill(true);if(t-t0<ms)requestAnimationFrame(f)};requestAnimationFrame(f);
}

  <button class="w span2 st" data-tint="up" ${i(5)} data-page="portfolios" data-pick="行业轮动"><span class="wt">行业轮动</span><span class="wn num" data-count="113317">113,317</span><span class="ws">${pct(13.32)} 累计</span>${spark(D.nav["行业轮动"])}</button>
  <button class="w st" data-tint="blue" ${i(6)} data-page="portfolios"><span class="wt">模拟组合</span><span class="wn num">${win}<span style="font-size:16px;color:var(--fg-3);font-weight:500"> / 14</span></span><div class="mini" style="grid-template-columns:1fr"><div><span>${best[0]}</span>${pct((best[1]/1e5-1)*100)}</div><div><span>${worst[0]}</span>${pct((worst[1]/1e5-1)*100)}</div></div></button>
  <button class="w st" data-tint="teal" ${i(7)} data-page="data"><span class="wt">数据健康</span><span class="wn num">4<span style="font-size:16px;color:var(--fg-3);font-weight:500"> / 7</span></span><span class="ws" style="margin-top:auto">融资融券滞后 7 个交易日</span></button>
  <button class="w st" data-tint="violet" ${i(8)} data-page="factors"><span class="wt">因子体检<span class="soon-tag">即将推出</span></span><span class="ws" style="margin-top:auto">准入、拥挤度和失效提醒</span></button>
  <button class="w st" data-tint="amber" ${i(9)} data-page="learn"><span class="wt">学习</span><span style="font-size:17px;font-weight:600;margin-top:auto">alpha 与 beta</span><span class="ws">下一节 · 基础</span></button>
  </div>`;
}

function vSplit(kind){
  const rows=kind==="stocks"?D.stocks.map(s=>({id:s[0],r1:s[1],r2:`<span class="mono">${s[0]}</span>`,rv:`<div class="num">${fmt(s[3])}</div><div style="font-size:11.5px">${pct(s[4])}</div>`}))
    :kind==="portfolios"?D.pf.map(p=>({id:p[0],r1:p[0],r2:`${p[2]} 只持仓`,rv:`<div class="num">${fmt(p[1],0)}</div><div style="font-size:11.5px">${pct((p[1]/1e5-1)*100)}</div>`}))
    :D.factors.map(f=>({id:f[0],r1:f[0],r2:f[2],rv:`<div class="num" style="font-size:15px;font-weight:600">${f[1]}</div>`}));
  return head(kind)+`<div class="split"><div class="list" id="list"><span class="lpill" id="lpill"></span>${rows.map((r,i)=>`<button class="row st" style="--i:${Math.min(i+2,12)}" data-sel="${r.id}" aria-current="${S.sel[kind]===r.id}"><span class="r1">${r.r1}</span><span class="rv">${r.rv}</span><span class="r2">${r.r2}</span></button>`).join('')}</div><div class="detail" id="detail">${detail(kind)}</div></div>`;
}
function detail(kind){
  const id=S.sel[kind];
  if(kind==="stocks"){const s=D.stocks.find(x=>x[0]===id);const ind=D.ind.find(x=>x[0]===s[2]);
    return `<div class="st" style="--i:2"><div class="eyebrow">${s[2]} · <span class="mono">${s[0]}</span></div><div><span class="big num">${fmt(s[3])}</span><span class="chg">${pct(s[4])}</span></div></div>
    <div class="facts st" style="--i:3"><div><span>成交额</span><b class="num">${fmt(s[5],1)} 亿</b></div><div><span>行业当日</span><b>${ind?pct(ind[1]):'—'}</b></div><div><span>相对行业</span><b>${ind?pct(s[4]-ind[1]):'—'}</b></div></div>
    <div class="card glass-thin st" style="--i:4"><h4>V5 维度分</h4>${s[6]?[["基本面",s[6].f],["技术面",s[6].t],["资金面",s[6].c]].map(([k,v])=>`<div class="bar3"><span>${k}</span><i style="width:${v}%"></i><em class="num">${v}</em></div>`).join(''):`<div style="color:var(--fg-3)">本期未进入评分样本</div>`}</div>
    ${soon("因子画像","D15","这只股票在各因子上的分位")}`}
  if(kind==="portfolios"){const f=D.pf.find(x=>x[0]===id),r=(f[1]/1e5-1)*100,ser=D.nav[f[0]];
    return `<div class="st" style="--i:2"><div class="eyebrow">总资产 · 初始 100,000</div><div><span class="big num">${fmt(f[1],0)}</span><span class="chg">${pct(r)}</span></div></div>
    <div class="facts st" style="--i:3"><div><span>持仓</span><b class="num">${f[2]} 只</b></div><div><span>基准</span><b>中证 500</b></div><div><span>市场</span><b>A 股</b></div></div>
    ${ser?`<div class="card glass-thin st" style="--i:4"><h4>近 ${ser.length} 个快照</h4>${spark(ser,110)}</div>`:''}
    ${D.hold[f[0]]?`<div class="card glass-thin st" style="--i:5"><h4>持仓</h4><div class="chips">${D.hold[f[0]].map(n=>`<span class="chip glass-thin">${n}</span>`).join('')}</div></div>`:''}
    ${soon("业绩归因","D14","收益拆成市场、风格、行业、个股")}`}
  const f=D.factors.find(x=>x[0]===id);
  return `<div class="st" style="--i:2"><div class="eyebrow">因子登记表 · 共 221 个</div><div><span class="big num">${f[1]}</span><span class="chg" style="color:var(--fg-2)">${f[0]}</span></div></div>
  <div class="card glass-thin st" style="--i:3"><h4>构成</h4>${D.factors.map(x=>`<div class="bar3" style="grid-template-columns:64px 1fr 32px"><span>${x[0].replace('因子','')}</span><i style="width:${x[1]/187*100}%"></i><em class="num">${x[1]}</em></div>`).join('')}</div>
  ${soon("因子体检","D15","IC 衰减、单调性、残差 IC、大小盘分层")}`;
}

function vHeat(){
  const mx=3.3;
  return head("heatmap")+`<div class="heat">`+D.ind.map(([n,c],k)=>{const a=Math.min(1,Math.abs(c)/mx),col=c>=0?'var(--up)':'var(--down)';return `<div class="st" style="--i:${Math.min(k,16)};background:color-mix(in srgb,${col} ${Math.round(10+a*62)}%,var(--glass-strong));color:${a>.5?'#fff':'var(--fg)'}"><small>${n}</small><b class="num">${c>0?'+':''}${fmt(c)}%</b></div>`}).join('')+`</div>`;
}
function vLearn(){
  const A=[["基础",[["alpha 与 beta",3],["夏普比率",3],["量化用什么数据",2],["波动率与对数正态",1]]],["因子研究",[["20 个因子只等于几个",3],["回测好得离谱先查什么",3],["IC、ICIR 和 t 值",2],["因子的有效期",2]]],["组合与风险",[["业绩归因",3],["风险因子是什么",3],["分散化",2],["主动管理基本定律",2]]],["AI 研究",[["回测为什么会骗人",3],["LLM 怎么挖因子",2],["文字怎么变成策略",1]]]];
  return head("learn")+`<div class="areas">`+A.map(([a,ts],k)=>`<div class="area glass-thin st" style="--i:${k+2}"><h4>${a}</h4><ul>${ts.map(([t,s])=>`<li><span>${t}</span><span class="lvl">${'●'.repeat(s)}</span></li>`).join('')}</ul></div>`).join('')+`</div>`;
}
function vData(){
  const C={ok:["var(--down)","正常"],warn:["var(--warn)","注意"],bad:["var(--up)","停更"]};
  return head("data")+`<div class="tbl glass-thin st" style="--i:2"><table><thead><tr><th>数据</th><th>表</th><th>最近更新</th><th class="r">状态</th></tr></thead><tbody>`+D.data.map(r=>`<tr><td>${r[0]}</td><td class="mono" style="color:var(--fg-3)">${r[1]}</td><td class="num">${r[2]}</td><td class="r"><span class="st-dot"><i style="background:${C[r[3]][0]}"></i>${C[r[3]][1]}</span></td></tr>`).join('')+`</tbody></table></div>`;
}
function vOther(p){
  const map={mining:["LLM 挖因子","D10","想法 → qlib 表达式 → 编译检查 → 体检准入"],reports:["研报","P8","东方财富研报 + 一致预期,每日增量"],risk:["风险与归因","D14","风险模型、风险分解、按风险定仓"]};
  return head(p)+(map[p]?soon(...map[p]):`<div class="ws st" style="--i:2">现有页面 <span class="mono">/${p}</span>,demo 中未展开</div>`);
}
function view(p){
  if(S.mode==="C")return vHome();
  if(p==="home")return vHome();
  if(["stocks","portfolios","factors"].includes(p))return vSplit(p);
  if(p==="heatmap")return vHeat();
  if(p==="learn")return vLearn();
  if(p==="data")return vData();
  return vOther(p);
}

/* 检查器 */
function inspector(){
  const p=S.page;let h;
  if(p==="stocks"){const s=D.stocks.find(x=>x[0]===S.sel.stocks);h=`<h3>${s[1]}</h3><div class="sub">检查器</div><dl class="kv"><dt>代码</dt><dd class="mono">${s[0]}</dd><dt>申万一级</dt><dd>${s[2]}</dd><dt>收盘</dt><dd class="num">${fmt(s[3])}</dd><dt>涨跌</dt><dd>${pct(s[4])}</dd></dl><div class="hr"></div><div class="ws">因子分位和体检要点即将推出(D15)</div>`}
  else if(p==="portfolios"){const f=D.pf.find(x=>x[0]===S.sel.portfolios);h=`<h3>${f[0]}</h3><div class="sub">收益来源 · 布局示意</div>${["市场","风格","行业","个股"].map((k,i)=>`<div class="bar3"><span>${k}</span><i style="width:${[62,38,24,14][i]}%;opacity:.45"></i><em>—</em></div>`).join('')}<div class="hr"></div><div class="ws">归因数字在风险模型上线后填入(D14)</div>`}
  else if(p==="factors"){h=`<h3>准入规则</h3><div class="sub">D15 · 已决定</div><dl class="kv"><dt>|ρ| &lt; 0.5</dt><dd>进入下一步</dd><dt>0.5 – 0.7</dt><dd>须证明残差增益</dd><dt>&gt; 0.7</dt><dd>只能替换</dd><dt>&gt; 0.85</dt><dd>二选一</dd><dt>|IC| &gt; 0.15</dt><dd style="color:var(--warn)">标黄</dd><dt>|IC| &gt; 0.3</dt><dd class="up">标红</dd></dl>`}
  else {const b=D.breadth;h=`<h3>今日要点</h3><div class="sub">${D.date}</div><dl class="kv"><dt>上涨占比</dt><dd class="num">${fmt(b.up/b.n*100,1)}%</dd><dt>最强</dt><dd>银行 ${pct(1.52)}</dd><dt>最弱</dt><dd>电子 ${pct(-3.28)}</dd><dt>组合盈利</dt><dd class="num">1 / 14</dd></dl><div class="hr"></div><div class="ws">拥挤度预警即将推出(D13)</div>`}
  $("insp").innerHTML=h;
}

/* 转场:按方向滑动 + 模糊 */
let cur=null;
function show(dir){
  const st=$("stage"),nv=document.createElement("div");
  nv.className="view"+(S.insp&&S.mode!=="C"?" with-insp":"");nv.innerHTML=view(S.page);
  const old=cur;st.appendChild(nv);cur=nv;
  if(old&&!reduce&&old.animate){
    const dx=dir*28;
    old.animate([{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:`translateX(${-dx}px) scale(.99)`,filter:'blur(8px)'}],{duration:320,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).onfinish=()=>old.remove();
    nv.animate([{opacity:0,transform:`translateX(${dx}px)`},{opacity:1,transform:'none'}],{duration:620,easing:getComputedStyle(document.documentElement).getPropertyValue('--spring').trim()||'ease'});
  } else if(old) old.remove();
  requestAnimationFrame(()=>{moveLPill(true);countUp(nv)});
  inspector();
}
function moveLPill(instant){
  const lp=$("lpill"),b=document.querySelector('#list [aria-current="true"]');if(!lp||!b)return;
  if(instant)lp.style.transition='none';
  lp.style.height=b.offsetHeight+'px';lp.style.transform=`translateY(${b.offsetTop}px)`;
  if(instant){lp.offsetHeight;lp.style.transition=''}
}
function countUp(root){
  if(reduce)return;
  root.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,t0=performance.now(),dur=1100;
    const tick=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);el.textContent=Math.round(to*e).toLocaleString('zh-CN');if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)});
}
function go(p,pick){
  const dir=ORDER.indexOf(p)>=ORDER.indexOf(S.page)?1:-1;
  if(S.mode==="C"&&p!=="home")setMode("B",true);
  S.page=p;if(pick)S.sel[p]=pick;setNav();show(dir);
}
function select(id){
  const k=S.page;if(S.sel[k]===id)return;S.sel[k]=id;
  document.querySelectorAll('#list [data-sel]').forEach(b=>b.setAttribute("aria-current",b.dataset.sel===id));moveLPill(false);
  const d=$("detail");d.innerHTML=detail(k);countUp(d);inspector();
}
function setMode(m,silent){
  S.mode=m;const w=$("win");w.classList.toggle("mA",m==="A");w.classList.toggle("mC",m==="C");
  document.querySelectorAll("#seg [data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===m));moveThumb();
  if(m==="C"){S.page="home";setNav()}
  if(!silent)show(0);
}
function moveThumb(){const b=document.querySelector('#seg [aria-pressed="true"]'),t=$("thumb");t.style.width=b.offsetWidth+'px';t.style.transform=`translateX(${b.offsetLeft}px)`}
function toggleInsp(){S.insp=!S.insp;$("insp").classList.toggle("open",S.insp);$("ibtn").setAttribute("aria-pressed",S.insp);if(cur)cur.classList.toggle("with-insp",S.insp&&S.mode!=="C")}

document.addEventListener("click",e=>{
  const pg=e.target.closest("[data-page]");if(pg){go(pg.dataset.page,pg.dataset.pick);return}
  const sl=e.target.closest("[data-sel]");if(sl){select(sl.dataset.sel);return}
  const m=e.target.closest("[data-mode]");if(m){setMode(m.dataset.mode);return}
  if(e.target.closest("#ibtn")){toggleInsp();return}
  if(e.target.closest("#kbtn")||e.target.closest("#openK")){openK();return}
  if(e.target.closest("#themebtn")){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?"light":"dark";return}
  if(e.target.closest("#infobtn")){const o=$("info").classList.toggle("open");$("infobtn").setAttribute("aria-expanded",o);return}
  if(!e.target.closest("#info"))$("info").classList.remove("open");
  if(e.target.id==="scrim")closeK();
});

/* ⌘K */
const IDX=[...SECTIONS.flatMap(s=>s.items.map(([id,n])=>({k:"页面",label:`${n}`,sub:s.name,q:n+id+s.name,act:()=>go(id)}))),
  ...D.stocks.map(s=>({k:"股票",label:s[1],sub:s[0],q:s[0]+s[1],act:()=>go("stocks",s[0])})),
  ...D.pf.map(p=>({k:"组合",label:p[0],sub:"",q:p[0],act:()=>go("portfolios",p[0])}))];
let kSel=0,kList=[];
function openK(){$("scrim").classList.add("open");$("kq").value="";kSel=0;drawK();setTimeout(()=>$("kq").focus(),30)}
function closeK(){$("scrim").classList.remove("open")}
function drawK(){
  const q=$("kq").value.trim().toLowerCase();
  kList=(q?IDX.filter(x=>x.q.toLowerCase().includes(q)):IDX.filter(x=>x.k!=="组合").slice(0,9)).slice(0,10);
  kSel=Math.min(kSel,Math.max(0,kList.length-1));
  $("kres").innerHTML=kList.length?`<span class="kp" id="kp"></span>`+kList.map((x,i)=>`<button role="option" aria-selected="${i===kSel}" data-k="${i}"><span>${x.label}</span><span class="mono" style="color:var(--fg-3)">${x.sub}</span><span class="t">${x.k}</span></button>`).join(''):`<div class="empty">没有匹配项,试试 600519 或"轮动"</div>`;
  moveK(true);
}
function moveK(instant){const kp=$("kp"),b=$("kres").querySelector(`[data-k="${kSel}"]`);if(!kp||!b)return;if(instant)kp.style.transition='none';kp.style.height=b.offsetHeight+'px';kp.style.transform=`translateY(${b.offsetTop-8}px)`;kp.style.top='8px';if(instant){kp.offsetHeight;kp.style.transition=''}
  $("kres").querySelectorAll("[data-k]").forEach(x=>x.setAttribute("aria-selected",+x.dataset.k===kSel))}
$("kq").addEventListener("input",()=>{kSel=0;drawK()});
$("kres").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b){closeK();kList[+b.dataset.k].act()}});
$("kres").addEventListener("mousemove",e=>{const b=e.target.closest("[data-k]");if(b&&+b.dataset.k!==kSel){kSel=+b.dataset.k;moveK(false)}});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("scrim").classList.contains("open")?closeK():openK();return}
  if(!$("scrim").classList.contains("open"))return;
  if(e.key==="Escape")closeK();
  else if(e.key==="ArrowDown"){kSel=Math.min(kSel+1,kList.length-1);moveK(false);e.preventDefault()}
  else if(e.key==="ArrowUp"){kSel=Math.max(kSel-1,0);moveK(false);e.preventDefault()}
  else if(e.key==="Enter"&&kList[kSel]){closeK();kList[kSel].act()}
});
addEventListener("resize",()=>{movePill(true);moveLPill(true);moveThumb()});

/* 小组件:高光跟随鼠标 + 轻微倾斜,离开时弹回 */
if(!reduce&&matchMedia('(hover:hover)').matches){
  document.addEventListener("pointermove",e=>{
    const w=e.target.closest(".w");
    document.querySelectorAll(".w.hot").forEach(x=>{if(x!==w){x.classList.remove("hot");x.style.removeProperty("--rx");x.style.removeProperty("--ry")}});
    if(!w)return;
    const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    w.classList.add("hot");
    w.style.setProperty("--mx",(x*100)+"%");w.style.setProperty("--my",(y*100)+"%");
    w.style.setProperty("--ry",((x-.5)*5).toFixed(2)+"deg");w.style.setProperty("--rx",((.5-y)*5).toFixed(2)+"deg");
  });
  document.addEventListener("pointerleave",()=>document.querySelectorAll(".w.hot").forEach(x=>{x.classList.remove("hot");x.style.removeProperty("--rx");x.style.removeProperty("--ry")}));
}

renderNav();show(0);moveThumb();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{movePill(true);moveThumb()});
</script>
